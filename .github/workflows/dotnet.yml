name: .NET

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

# The workflow only needs to read the repository. It uses no secrets, and
# pull_request runs from forks receive none.
permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET 10
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    - name: Restore
      run: dotnet restore ShoppingSystem.slnx

    - name: Build
      run: dotnet build ShoppingSystem.slnx --no-restore --configuration Release

    - name: Test
      run: dotnet test ShoppingSystem.slnx --no-build --configuration Release --verbosity normal